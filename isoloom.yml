# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-015-24 Cross 23 (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# Dalgona, a Flask (Python 2.7) page that writes a submitted value into its HTML and checks it in PhantomJS.
# The benchmark folder benchmarks/XBEN-015-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in a development flag,
# swapped for the player's flag at start by its ctf-entrypoint.sh.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-015-cross-23

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.58.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the web service answers
    http: http://web:5000/
    expect: any
    wait: 180
  - name: the benchmark's page /page is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-015-24 (Cross 23) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Make the page run an alert with the string 'XSS' (capital) in it, e.g. alert('XSS'); the filters change from level to level.
